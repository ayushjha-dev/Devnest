<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Developer productivity, code and tooling">
  <defs>
    <pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.6" fill="#000" opacity=".16"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#FAF7EE"/>
  <rect width="1600" height="900" fill="url(#d)"/>

  <rect x="404" y="176" width="792" height="520" rx="28" fill="#000"/>
  <rect x="380" y="152" width="792" height="520" rx="28" fill="#fff" stroke="#000" stroke-width="6"/>
  <path d="M380 152 H1172 V244 H380 Z" fill="#3A3A3A" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="428" cy="198" r="15" fill="#FF70A6"/>
  <circle cx="472" cy="198" r="15" fill="#FFE600"/>
  <circle cx="516" cy="198" r="15" fill="#88EA73"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#000">
    <text x="424" y="308" fill="#C4B5FD">const</text>
    <text x="504" y="308">agent = </text>
    <text x="628" y="308" fill="#FF70A6">await</text>
    <text x="716" y="308">run(</text>
    <text x="762" y="308" fill="#0A8A5F">task</text>
    <text x="820" y="308">);</text>
    <text x="424" y="360" fill="#C4B5FD">await</text>
    <text x="504" y="360">verify(</text>
    <text x="606" y="360" fill="#0A8A5F">result</text>
    <text x="694" y="360">);</text>
    <text x="424" y="412" fill="#8A8A8A">// never skip this line</text>
    <text x="424" y="464" fill="#C4B5FD">await</text>
    <text x="504" y="464">commit(</text>
    <text x="620" y="464" fill="#0A8A5F">withReview</text>
    <text x="788" y="464">);</text>
  </g>
  <g stroke="#000" stroke-width="4" stroke-linecap="round">
    <path d="M424 486 h230" stroke="#88EA73" stroke-width="8"/>
    <path d="M424 506 h170" stroke="#FF70A6" stroke-width="8"/>
    <path d="M424 526 h200" stroke="#70D6FF" stroke-width="8"/>
  </g>

  <rect x="424" y="574" width="300" height="62" rx="20" fill="#FFE600" stroke="#000" stroke-width="6"/>
  <text x="574" y="614" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="24" fill="#000" text-anchor="middle">hand off the work</text>
  <rect x="764" y="574" width="300" height="62" rx="20" fill="#88EA73" stroke="#000" stroke-width="6"/>
  <text x="914" y="614" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="24" fill="#000" text-anchor="middle">keep the review</text>

  <circle cx="236" cy="300" r="60" fill="#FFE600" stroke="#000" stroke-width="6"/>
  <path d="M212 300 h48 M236 276 v48" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <circle cx="1368" cy="620" r="60" fill="#C4B5FD" stroke="#000" stroke-width="6"/>
  <path d="M1340 620 l20 22 l38 -44" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="472" y="742" width="656" height="88" rx="26" fill="#000"/>
  <rect x="456" y="726" width="656" height="88" rx="26" fill="#70D6FF" stroke="#000" stroke-width="6"/>
  <text x="784" y="782" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="28" fill="#000" text-anchor="middle">BETTER TOOLS, SMARTER APPS</text>
</svg>